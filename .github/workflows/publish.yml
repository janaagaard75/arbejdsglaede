name: "Publish production release"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        default: "all"
        type: choice
        options:
          - all
          - android
          - ios

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set app version from Git tag
        run: |
          VERSION_TAG=$(git tag --points-at HEAD --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$VERSION_TAG" ]; then
            echo "::error::This commit has no version tag. Wait for the version tagging workflow to finish before publishing."
            exit 1
          fi
          APP_VERSION=${VERSION_TAG#v}
          sed -i "s/version: \"0.0.0\"/version: \"$APP_VERSION\"/" app.config.ts
          echo "Building app version $APP_VERSION."

      - name: Enable Yarn
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          cache-dependency-path: yarn.lock
          cache: "yarn"
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set up EAS command
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{secrets.EXPO_TOKEN}}

      - name: Build and submit production release
        run: eas build --profile production --platform ${{inputs.platform || 'all'}} --non-interactive --auto-submit
