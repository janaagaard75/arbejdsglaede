name: "Tag with version"

on:
  push:
    branches:
      - main

concurrency:
  group: ${{github.workflow}}
  queue: max

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Tag with next version
        run: |
          EXISTING_TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -n "$EXISTING_TAG" ]; then
            echo "This commit is already tagged with $EXISTING_TAG."
            exit 0
          fi

          LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          LATEST_VERSION=${LATEST_TAG#v}
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST_VERSION:-1.0.0}"
          NEW_TAG="v$MAJOR.$((10#$MINOR + 1)).0"

          git tag "$NEW_TAG" "$GITHUB_SHA"
          git push origin "$NEW_TAG"
          echo "Tagged $GITHUB_SHA with $NEW_TAG."
