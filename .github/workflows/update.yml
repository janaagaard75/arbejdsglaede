name: "Publish OTA update"

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel"
        default: "production"
        type: choice
        options:
          - production
          - preview
      message:
        description: "Message"
        required: true
        type: string
      platform:
        description: "Platform"
        default: "all"
        type: choice
        options:
          - all
          - android
          - ios

concurrency:
  group: ${{github.workflow}}-${{inputs.channel}}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Enable Yarn
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          cache-dependency-path: yarn.lock
          cache: "yarn"
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set up EAS command
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{secrets.EXPO_TOKEN}}

      - name: Publish update
        env:
          CHANNEL: ${{inputs.channel}}
          MESSAGE: ${{inputs.message}}
          PLATFORM: ${{inputs.platform}}
        run: eas update --channel "$CHANNEL" --environment "$CHANNEL" --platform "$PLATFORM" --message "$MESSAGE" --non-interactive
